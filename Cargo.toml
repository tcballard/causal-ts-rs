[package]
name = "causal-ts"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Native Rust causal discovery for time series"
license = "GPL-3.0-or-later"

[lib]
name = "causal_ts"

[[bin]]
name = "causal-ts"
path = "src/main.rs"

[[example]]
name = "compare"
required-features = ["neural"]

[[example]]
name = "profile_grace"
required-features = ["neural"]

[dependencies]
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
nalgebra = "0.33"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
statrs = "0.18"
thiserror = "2"

[features]
default = ["neural"]
neural = ["dep:candle-core", "dep:candle-nn"]
cuda = ["neural", "candle-core/cuda", "candle-nn/cuda"]
metal = ["neural", "candle-core/metal", "candle-nn/metal"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

